name: ci

on:
  push:
    branches:
      - master
      - dev
      - "plan/**"
  pull_request:

# This workflow provides the foundational Rust quality gates only.

jobs:
  rust-quality:
    name: Rust quality gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Print toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: >-
          cargo test --all-targets --all-features --
          --skip user_guide_lists_supported_clients_only_and_no_imaginary_commands
          --skip user_guide_names_design_root_and_backup_behavior
          --skip user_guide_uses_agent_status_for_machine_level_lifecycle
          --skip docs_readme_anchor_points_to_installation_and_lifecycle
          --skip en_zh_readmes_share_lifecycle_semantics
