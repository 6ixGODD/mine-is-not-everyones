# Plan 08-2: Release, checksum, bootstrap, and isolated installation smoke tests.
#
# Fixes the rejected Plan 08-1's three WP2 defects:
# 1. No gate uses `|| true`, `continue-on-error`, or equivalent failure masking.
# 2. Checksum is integrity-only (build once, SHA-256, verify), not a tautological
#    "determinism" comparison of the same unbuilt file.
# 3. Release-specific jobs run on every required OS (ubuntu, windows, macos).
#
# This workflow does NOT publish, push, create tags, mutate master, or perform
# stable release closure -- those steps are reserved for the independent
# final reviewer.
name: release-smoke

on:
  push:
    branches:
      - master
      - dev
      - "plan/**"
  pull_request:

jobs:
  # --- Multi-platform quality + distribution gates ---
  quality:
    name: Quality + distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Print toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W unsafe-code

      - name: cargo build
        run: cargo build --all-targets --all-features

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Distribution sync check
        run: python scripts/sync-plugin-assets.py --check

      - name: Skill frontmatter verify
        run: python scripts/verify.py

      - name: mine design validate
        run: ./target/debug/mine design validate --format json

      - name: mine graph validate
        run: ./target/debug/mine graph validate --format json

  # --- Release preflight (validation only; can genuinely fail) ---
  preflight:
    name: Release preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: Release preflight (must report readiness state without error)
        run: |
          # The release preflight reports can_release=false while Plan 08-2
          # itself is IN_PROGRESS (unresolved plans). The command itself must
          # exit 0 (it reports state; it does not fail when the repo is not
          # yet releasable). But if the binary crashes or the command is
          # unknown, that IS a failure.
          ./target/debug/mine release --format json
        # Note: `mine release` returns exit 0 even when can_release=false,
        # because it is a diagnostic reporting command, not a release
        # executor. The test suite in tests/e2e/release_tests.rs verifies
        # the actual contents of the preflight result.

  # --- Deterministic release artifact + SHA-256 integrity checksum ---
  artifact:
    name: Artifact + SHA-256 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate SHA-256 checksum (artifact integrity)
        shell: bash
        run: |
          # Build once, hash once. This is an INTEGRITY check (the checksum
          # verifies the artifact was not corrupted during upload/download),
          # NOT a reproducibility check. We do not claim the build is
          # byte-reproducible across independent builds. Python's hashlib is
          # used for cross-platform consistency (no reliance on certutil's
          # space-separated output format or platform-specific coreutils).
          BIN=target/release/mine
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/mine.exe
          python -c "
          import hashlib, sys
          with open('$BIN','rb') as f:
              h = hashlib.sha256(f.read()).hexdigest()
          with open('mine-sha256.txt','w') as f:
              f.write(h + '  ' + '$BIN' + chr(10))
          print(h + '  ' + '$BIN')
          "

      - name: Verify the checksum matches the actual artifact
        shell: bash
        run: |
          # Re-hash the same artifact and compare: this verifies the checksum
          # file was written correctly and the artifact has not changed since
          # hashing (e.g., a concurrent modification). It is NOT a claim of
          # build reproducibility.
          BIN=target/release/mine
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/mine.exe
          python -c "
          import hashlib
          with open('$BIN','rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          with open('mine-sha256.txt') as f:
              recorded = f.read().split()[0]
          assert actual == recorded, f'checksum mismatch: {actual} != {recorded}'
          print('checksum verified: ' + actual)
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-${{ matrix.os }}-checksums
          path: mine-sha256.txt
          retention-days: 7

  # --- Bootstrap smoke test (isolated temp repo, all platforms) ---
  bootstrap:
    name: Bootstrap smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: "Bootstrap: mine init on isolated empty repo"
        shell: bash
        run: |
          set -e
          TMP=$(mktemp -d)
          git init --quiet "$TMP"
          git -C "$TMP" config user.email "ci@test.com"
          git -C "$TMP" config user.name "ci"
          echo "# Test" > "$TMP/README.md"
          git -C "$TMP" add .
          git -C "$TMP" commit --quiet -m "init"
          ./target/debug/mine --repo "$TMP" init --format json
          # Verify skeleton created.
          test -f "$TMP/.mine/config.toml"
          test -f "$TMP/docs/design/.mine-design.toml"
          test -f "$TMP/docs/design/index.md"
          # Verify no plan workspace.
          ! test -d "$TMP/docs/plan"
          echo "Bootstrap smoke test passed"
          rm -rf "$TMP"

  # --- Isolated Agent installation + doctor smoke (all platforms) ---
  agent-install:
    name: Agent install + doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Agent install + doctor (isolated config root)
        shell: bash
        run: |
          set -e
          TMP=$(mktemp -d)
          for agent in claude-code codex pi opencode; do
            echo "=== Installing $agent ==="
            ./target/debug/mine --repo . agent install "$agent" --config-root "$TMP" --format json
          done
          echo "=== Doctor ==="
          ./target/debug/mine --repo . doctor --agents all --config-root "$TMP" --format json
          echo "Agent install smoke test passed"
          rm -rf "$TMP"

  # --- MCP tool discovery: starts real server, verifies exactly 12 tools ---
  mcp-discovery:
    name: MCP tool discovery (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: MCP tool discovery (exactly 12 tools)
        shell: bash
        run: |
          set -e
          # Start the real mine mcp serve subprocess, send initialize +
          # initialized + tools/list, capture stdout, and verify exactly 12
          # tools are exposed. The server reads JSON-RPC from stdin, responds,
          # and exits 0 on EOF (verified locally). No timeout, no `|| true`,
          # no failure masking: a crash (non-zero exit) fails this step via
          # `set -e`, and the explicit 12-tool assertion below can also fail.
          RESPONSE=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}\n{"jsonrpc":"2.0","method":"notifications/initialized"}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' | ./target/debug/mine mcp serve 2>/dev/null)
          
          # Extract the tools/list response (id:2).
          TOOLS_LINE=$(echo "$RESPONSE" | grep '"id":2')
          if [ -z "$TOOLS_LINE" ]; then
            echo "ERROR: no tools/list response received from mine mcp serve"
            exit 1
          fi
          
          # Count tools in the response.
          TOOL_COUNT=$(echo "$TOOLS_LINE" | python -c "import sys,json;d=json.load(sys.stdin);print(len(d.get('result',{}).get('tools',[])))" 2>/dev/null || echo "0")
          
          echo "MCP tool count: $TOOL_COUNT"
          if [ "$TOOL_COUNT" != "12" ]; then
            echo "ERROR: expected 12 MCP tools, got $TOOL_COUNT"
            exit 1
          fi
          
          echo "MCP tool discovery smoke test passed (exactly 12 tools)"