# Release, checksum, bootstrap, and isolated-installation smoke tests.
#
# No gate masks failure. Checksums prove artifact integrity only; binary
# reproducibility is not claimed.
#
# Platform policy: only `quality` and `agent-install` need all three platforms
# (they compile/test platform-conditional code and exercise real
# junction/symlink/canonical-path filesystem APIs). `preflight`, `artifact`,
# `bootstrap`, and `mcp-discovery` are pure logic or redundant with `quality`,
# so they run on a single Ubuntu runner. Tag-triggered `release-artifacts`
# builds the real per-platform binaries via its own matrix.
#
# This workflow does NOT publish, push, create tags, mutate master, or perform
# stable release closure -- those steps are reserved for the independent
# final reviewer.
name: release-smoke

on:
  push:
    branches:
      - master
      - dev
      - "plan/**"
    tags:
      - "v*"
  pull_request:

jobs:
  # --- Multi-platform quality + distribution gates ---
  quality:
    name: Quality + distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Print toolchain
        run: |
          rustc --version
          cargo --version

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings -W unsafe-code

      - name: cargo build
        run: cargo build --all-targets --all-features

      - name: cargo test
        run: cargo test --all-targets --all-features

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Distribution sync check
        run: python scripts/sync-plugin-assets.py --check

      - name: Skill frontmatter verify
        run: python scripts/verify.py

      - name: mine design validate
        run: ./target/debug/mine design validate --format json

      - name: mine graph validate (development workspace only)
        shell: bash
        run: |
          if [ -f docs/plan/execution-graph.toml ]; then
            ./target/debug/mine graph validate --format json
          else
            echo "No development graph: valid stable tree; graph validation is not applicable."
          fi

  # --- Release preflight (validation only; can genuinely fail) ---
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: Release preflight (development workspace only)
        shell: bash
        run: |
          # Release preflight consumes the temporary execution graph. A stable
          # release tree intentionally omits docs/plan/, so it is not a valid
          # preflight input. Its stable-tree safety is instead covered by the
          # attached-branch doctor and release-candidate checks.
          if [ -f docs/plan/execution-graph.toml ]; then
            ./target/debug/mine release --format json
          else
            echo "No development graph: release preflight is not applicable on the stable tree."
          fi

  # --- Deterministic release artifact + SHA-256 integrity checksum (smoke) ---
  artifact:
    name: Artifact + SHA-256
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --quiet

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Generate SHA-256 checksum (artifact integrity)
        shell: bash
        run: |
          # Build once, hash once. This is an INTEGRITY check (the checksum
          # verifies the artifact was not corrupted during upload/download),
          # NOT a reproducibility check. We do not claim the build is
          # byte-reproducible across independent builds. Python's hashlib is
          # used for cross-platform consistency (no reliance on certutil's
          # space-separated output format or platform-specific coreutils).
          BIN=target/release/mine
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/mine.exe
          python -c "
          import hashlib, sys
          with open('$BIN','rb') as f:
              h = hashlib.sha256(f.read()).hexdigest()
          with open('mine-sha256.txt','w') as f:
              f.write(h + '  ' + '$BIN' + chr(10))
          print(h + '  ' + '$BIN')
          "

      - name: Verify the checksum matches the actual artifact
        shell: bash
        run: |
          # Re-hash the same artifact and compare: this verifies the checksum
          # file was written correctly and the artifact has not changed since
          # hashing (e.g., a concurrent modification). It is NOT a claim of
          # build reproducibility.
          BIN=target/release/mine
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/mine.exe
          python -c "
          import hashlib
          with open('$BIN','rb') as f:
              actual = hashlib.sha256(f.read()).hexdigest()
          with open('mine-sha256.txt') as f:
              recorded = f.read().split()[0]
          assert actual == recorded, f'checksum mismatch: {actual} != {recorded}'
          print('checksum verified: ' + actual)
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mine-checksums
          path: mine-sha256.txt
          retention-days: 7

  # --- Bootstrap smoke test (isolated temp repo) ---
  bootstrap:
    name: Bootstrap smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: "Bootstrap: mine init on isolated empty repo"
        shell: bash
        run: |
          set -e
          TMP=$(mktemp -d)
          git init --quiet "$TMP"
          git -C "$TMP" config user.email "ci@test.com"
          git -C "$TMP" config user.name "ci"
          echo "# Test" > "$TMP/README.md"
          git -C "$TMP" add .
          git -C "$TMP" commit --quiet -m "init"
          ./target/debug/mine --repo "$TMP" init --format json
          # Verify skeleton created.
          test -f "$TMP/.mine/config.toml"
          test -f "$TMP/docs/design/.mine-design.toml"
          test -f "$TMP/docs/design/index.md"
          # Verify no plan workspace.
          ! test -d "$TMP/docs/plan"
          echo "Bootstrap smoke test passed"
          rm -rf "$TMP"

  # --- Isolated mine setup + agent status smoke (single platform) ---
  # End-to-end check of the bootstrap->setup->install path with an isolated
  # config root. Platform-specific junction/symlink/MCP behavior is already
  # covered by the quality job's agent_setup tests on all three platforms;
  # this job only verifies the setup command's integration layer, so a single
  # Ubuntu runner suffices.
  agent-install:
    name: mine setup + agent status
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build mine
        run: cargo build --quiet

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: mine setup + agent status (isolated config root, non-interactive)
        shell: bash
        run: |
          set -e
          TMP=$(mktemp -d)
          # Non-TTY CI: exercise the mine setup non-interactive path with an
          # explicit agent list and isolated config root. This installs all
          # four agents (MCP + Skills) exactly as bootstrap would on a user
          # machine with --agents.
          ./target/debug/mine setup --agents claude-code,codex,pi,opencode --yes --config-root "$TMP" --format json
          echo "=== agent status ==="
          # Verify all four agents are installed with MCP registered. Use agent
          # status (not full doctor) because doctor also checks graph/git which
          # are not meaningful on a detached tag checkout.
          ./target/debug/mine agent status --config-root "$TMP" --format json > status.json
          python -c "
          import json
          d=json.load(open('status.json'))
          installs={i['agent']: i for i in d['data']['installs']}
          expected={'claude-code','codex','pi','opencode'}
          assert set(installs)==expected, f'expected {expected}, got {set(installs)}'
          for a,i in installs.items():
              assert i['files']>0, f'{a}: no files'
              if a!='pi':
                  assert i['mcp_registered'], f'{a}: MCP not registered'
          print('mine setup smoke test passed: 4 agents installed, MCP registered for claude-code/codex/opencode')
          "
          rm -f status.json
          rm -rf "$TMP"

  # --- Real downloadable release assets (tag pushes only) ---
  # Triggered by pushing a `v*` tag. Produces prebuilt, downloadable binaries
  # for Linux (x86_64), macOS (Apple Silicon), and Windows (x86_64),
  # packages each as an archive with a SHA-256 sidecar, and publishes a real
  # GitHub Release with those assets. End users install `mine` by downloading
  # the archive for their platform -- no Rust toolchain required. Branch/PR
  # pushes never reach this job (`if` gate), so they cannot accidentally
  # publish a release.
  release-artifacts:
    name: Release artifact (${{ matrix.display }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, display: linux-x86_64, archive: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, display: macos-arm64, archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, display: windows-x86_64, archive: zip }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive + SHA-256
        shell: bash
        run: |
          set -eu
          TARGET='${{ matrix.target }}'
          DISPLAY='${{ matrix.display }}'
          ARCHIVE='${{ matrix.archive }}'
          if [ "$ARCHIVE" = "zip" ]; then
            EXT=zip
            BIN=target/"$TARGET"/release/mine.exe
            BIN_NAME=mine.exe
          else
            EXT=tar.gz
            BIN=target/"$TARGET"/release/mine
            BIN_NAME=mine
          fi
          test -f "$BIN"
          STAGE="mine-$DISPLAY-stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          # Keep the platform-native binary name (mine.exe on Windows, mine on
          # Unix). Renaming mine.exe -> mine breaks Windows users and
          # bootstrap's archive lookup.
          cp "$BIN" "$STAGE"/"$BIN_NAME"
          cp README.md LICENSE "$STAGE"/ 2>/dev/null || true
          if [ "$ARCHIVE" = "zip" ]; then
            7z a "mine-$DISPLAY.$EXT" "$STAGE"
          else
            tar czf "mine-$DISPLAY.$EXT" -C "$STAGE" .
          fi
          FILE="mine-$DISPLAY.$EXT"
          python -c "import hashlib; h=hashlib.sha256(open('$FILE','rb').read()).hexdigest(); open('$FILE'+'.sha256','w').write(h+'  '+'$FILE'+chr(10)); print(h, '$FILE')"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifact-${{ matrix.display }}
          path: |
            mine-${{ matrix.display }}.tar.gz
            mine-${{ matrix.display }}.tar.gz.sha256
            mine-${{ matrix.display }}.zip
            mine-${{ matrix.display }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git-cliff can walk commits since the last tag.
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Build release body (changelog + template)
        shell: bash
        env:
          CLIFF_CONTENT: ${{ steps.cliff.outputs.content }}
        run: |
          set -eu
          # CLIFF_CONTENT is the changelog text (not a file path); write it
          # then append the hand-written install/usage template.
          {
            printf '%s\n' "$CLIFF_CONTENT"
            echo
            cat .github/RELEASE_NOTES_TEMPLATE.md
          } > RELEASE_BODY.md
          echo "--- release body ---"
          cat RELEASE_BODY.md

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifact-*
          merge-multiple: true
          path: release

      - name: Build combined SHA256 manifest
        shell: bash
        run: |
          set -eu
          cd release
          rm -f SHA256SUMS.txt
          cat *.sha256 > SHA256SUMS.txt
          echo "Combined manifest:"
          cat SHA256SUMS.txt
          echo
          echo "Assets present:"
          ls -l

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          files: |
            release/mine-*.tar.gz
            release/mine-*.zip
            release/mine-*.tar.gz.sha256
            release/mine-*.zip.sha256
            release/SHA256SUMS.txt