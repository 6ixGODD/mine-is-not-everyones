# git-cliff configuration for MINE.
#
# Generates a grouped changelog from Conventional Commits. Used by
# .github/workflows/changelog.yml and consumed by the release workflow to
# build the GitHub Release body (changelog + a short install/usage section).
#
# See https://git-cliff.org/docs/configuration for the full schema.

[changelog]
header = ""
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})\
{% else %}\
    ## Unreleased\
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits -%}
    - {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}{% if commit.sha %} (`{{ commit.sha | truncate(length=7, end="") }}`){% endif %}
{% endfor %}\
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false

# Group commits by type. Order of entries determines group order in the output.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^style", group = "Styling" },
    { message = "^revert", group = "Reverts" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
